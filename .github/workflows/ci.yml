name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CodeGraphMcp.sln

      - name: Build
        run: dotnet build CodeGraphMcp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeGraphMcp.sln --configuration Release --no-build --logger "trx" --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results
          retention-days: 30

      - name: Publish artifacts
        run: |
          dotnet publish src/CodeGraphMcp -c Release -o ./publish/linux-x64 --runtime linux-x64 --self-contained true
          dotnet publish src/CodeGraphMcp -c Release -o ./publish/osx-arm64 --runtime osx-arm64 --self-contained true
          dotnet publish src/CodeGraphMcp -c Release -o ./publish/win-x64 --runtime win-x64 --self-contained true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-mcp-linux-x64
          path: ./publish/linux-x64
          retention-days: 90

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-mcp-osx-arm64
          path: ./publish/osx-arm64
          retention-days: 90

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-mcp-win-x64
          path: ./publish/win-x64
          retention-days: 90
