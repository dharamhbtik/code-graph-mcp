name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CodeGraphMcp.sln

      - name: Build
        run: dotnet build CodeGraphMcp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeGraphMcp.sln --configuration Release --no-build

      - name: Publish Linux x64
        run: dotnet publish src/CodeGraphMcp -c Release -o ./publish/linux-x64 --runtime linux-x64 --self-contained true

      - name: Publish macOS ARM64
        run: dotnet publish src/CodeGraphMcp -c Release -o ./publish/osx-arm64 --runtime osx-arm64 --self-contained true

      - name: Publish Windows x64
        run: dotnet publish src/CodeGraphMcp -c Release -o ./publish/win-x64 --runtime win-x64 --self-contained true

      - name: Copy scripts
        run: |
          cp scripts/parse-js.mjs ./publish/linux-x64/
          cp scripts/parse-js.mjs ./publish/osx-arm64/
          cp scripts/parse-js.mjs ./publish/win-x64/

      - name: Create archives
        run: |
          cd publish
          tar -czf codegraph-mcp-linux-x64.tar.gz -C linux-x64 .
          tar -czf codegraph-mcp-osx-arm64.tar.gz -C osx-arm64 .
          cd win-x64 && zip -r ../codegraph-mcp-win-x64.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/codegraph-mcp-linux-x64.tar.gz
            publish/codegraph-mcp-osx-arm64.tar.gz
            publish/codegraph-mcp-win-x64.zip
